title: "Ziheng Yu"

# Load theme from GitHub repository
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

# 指定使用 _data/navigation.yml 里的 main 导航栏
main:
  - title: "Home"
    url: /
  - title: "Research"
    url: /research/
  - title: "Teaching"
    url: /teaching/
  - title: "CV"
    url: /Ziheng_Yu_CV.pdf

# 必需插件
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
