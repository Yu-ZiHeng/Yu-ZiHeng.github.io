title: "Ziheng Yu"

# Load theme from GitHub repository
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

author:
  name             : "Ziheng Yu （余子恒）"
  avatar           : "/photo.jpg" # Path to your photo
  bio              : "Ph.D. Candidate in Economics<br>the University of Texas at Austin"
  location         : "Austin, TX, USA"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:ziheng.yu@utexas.edu"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Yu-ZiHeng"
      
# 指定使用 _data/navigation.yml 里的 main 导航栏
main:
  - title: "Home"
    url: /
  - title: "Research"
    url: /research/
  - title: "Teaching & Working Experiences"
    url: /teaching/
  - title: "CV"
    url: /CV.pdf

# 必需插件
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

defaults:
  # 针对所有页面 (Pages) 自动开启侧边栏
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true
